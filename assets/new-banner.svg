    </radialGradient>

    
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="55%" stop-color="#060709" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    
    <linearGradient id="horizonFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FB89A" stop-opacity="0" />
