<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330">
  <defs>
    
    <radialGradient id="skyBg" cx="72%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#1d1a19" />
      <stop offset="42%" stop-color="#111317" />
      <stop offset="100%" stop-color="#040406" />
    </radialGradient>

    
    <radialGradient id="sunGlow" cx="71.8%" cy="31.5%" r="28%">
      <stop offset="0%" stop-color="#e0782a" stop-opacity="0.28" />
